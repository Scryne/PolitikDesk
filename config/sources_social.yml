# PolitikDesk — Sosyal Medya & X (Twitter) Hesap Listesi (Spec v3.5 §9.4, §12.4)
#
# ⛔ SERT EPİSTEMİK KURAL (Spec §9.4 / R7):
#    Sosyal medya (Twitter/X) içerikleri HER ZAMAN Tier 4 (social) olarak işlenir.
#    R7 kuralı gereği yalnızca sosyal medya kanıtı içeren bir iddia ASLA 🟢 (strongly_corroborated)
#    veya 🟡 (partially_corroborated) olamaz; azami 🟠 (single_source) olabilir.
#    Sosyal medyadan çıkan tüm iddialar 'attribution' (aktör beyanı) türündedir.

