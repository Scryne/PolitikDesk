      farklı çıkış IP'si (TR) gerektirir" diye kayıtlıydı. Teşhis YANLIŞTI
      ve iki ayrı arıza üst üste binmişti:
      (1) Geliştirme makinesinde GoodbyeDPI çalışıyordu. TLS ClientHello'yu
      parçalayarak DPI atlatır; bu sunucu parçalanmış el sıkışmayı
      reddediyordu. WinDivert sürücü katmanında çalıştığı için Docker
      dahil TÜM trafiği etkiliyordu — "konteynerden de olmuyor" bulgusu
      bu yüzden yanlış yorumlanmıştı. Kapatılınca el sıkışma geçti.
      (2) Altından ikinci arıza çıktı: sunucu ARA SERTİFİKAYI göndermiyor
      (GeoTrust TLS RSA CA G1). Tarayıcılar eksik halkayı AIA'dan indirir,
      Python indirmez — site tarayıcıda açılır, koddan açılmaz. Halka
      `certs/` altına eklendi; doğrulama AÇIK kaldı.
      Ayrıca /rss bir RSS akışı DEĞİL, HTML döndürüyor (0 öğe). Gerçek
      yapı günlük fihrist sayfasıdır: /fihrist?tarih=YYYY-MM-DD
      —
      Konu filtresi ZORUNLU: filtresiz ingestion articles tablosunu
      alakasız kayıtla doldurur ve embedding maliyetini boşa harcar.
      (Bu dosyada `notes` iki kez tanımlıydı; YAML sonuncuyu alır ve
      birincisi sessizce düşerdi — birleştirildi.)

