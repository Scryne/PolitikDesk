    topics: [enflasyon, butce_ve_hazine, issizlik_ve_istihdam, buyume, kamu_borclanmasi]
    produces_scheduled_events: false
    notes: >-
      SINIR 21'DEN 22'YE ÇIKTI (20 Ağu 2026). EVDS'deki gerekçenin aynısı
      geçerlidir: bu bir MEDYA kaynağı değil, kurumun kendi yayınıdır.
      Çerçeveleme çeşitliliği için değil, kanıt motorunun Tier 1 açığı için
      eklendi.

      ÖLÇÜLEN AÇIK (20 Ağu 2026 denetimi): Tier 1 kaynaklar kanıt havuzunun
      yalnızca %1,8'ini üretiyor (75 kanıt bağı / 40 makale; Tier 3 ise 2.397
      bağ). Sonuç: R2'nin istediği ">=3 bağımsız grup VE Tier 1 birincil"
      bileşimini sağlayan iddia sayısı SIFIR ölçüldü. 42 iddia zaten >=3
      bağımsız gruba ulaşmış durumda; eksik olan tek şey Tier 1 ayağı.

      ⚠ BEKLENTİ DÜRÜST TUTULUYOR: bu kaynak o 42 iddiayı yeşile
      ÇEVİRMEYECEK. Ölçüldü — 42'sinin tamamı siyasi haber (CHP istifası,
      İBB davası, milli park kararı), SBB ise makro veri yorumu yayımlar.
      SBB'nin katkısı ancak kendi konularında (enflasyon, ödemeler dengesi,
      dış ticaret, işgücü) medya haberleriyle AYNI olaya kümelenirse
      ortaya çıkar ve bu zaman alır.

      BAĞIMSIZLIK GRUBU — AYRI, ama iddiası sınırlı:
      `official-sbb` ayrı bir gruptur çünkü SBB'nin kendi yayın
      sorumluluğu, kendi sitesi ve kendi analitik çıktısı vardır. Bu,
      SBB'nin Cumhurbaşkanlığı'ndan siyaseten bağımsız olduğu iddiası
      DEĞİLDİR; yalnızca "aynı yayının iki sitesi" olmadığının metadata
      seviyesinde doğru temsilidir (Spec §8.2'nin engellemek istediği şey
      Demirören tipi çakışmadır).

      ⚠ KALAN RİSK: SBB ile `cb-kararname` (sources_legislation.yml) aynı
      hiyerarşiye bağlıdır. Cumhurbaşkanlığı bir açıklama yapıp SBB onu
      yinelerse ikisi AYRI bağımsız kaynak sayılır. Bugün gerçekleşmesi
      olası değil (SBB veri yorumu, cb-kararname kararname yayımlar) ama
      izlenmelidir; gerçekleşirse çözüm `same_institution_as: cb-kararname`
      beyanıdır — mekanizma zaten mevcut, yeni kural gerekmez.

