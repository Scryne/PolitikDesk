  - slug: resmi-gazete
    name: "Resmî Gazete"
    tier: 1
    kind: official
    independence_group: "official-resmigazete"
    access_method: rss
    tos_status: allowed
    base_url: "https://www.resmigazete.gov.tr"
    feed_url: "https://www.resmigazete.gov.tr/rss"
    adapter: rss
    verified: false                     # 🔎 B-44: TLS el sıkışması düşüyor (aşağıya bak)
    robots_txt: null
    topics: [vergi_ve_harclar, asgari_ucret_ve_zamlar]
    produces_scheduled_events: false
    keyword_filter:                     # RG günde onlarca kalem yayımlar
      - vergi
      - harç
      - ÖTV
      - KDV
      - asgari ücret
      - yeniden değerleme
      - gümrük
      - tarife
      - katsayı
      - borçlanma
    notes: >-
      13 Ağu 2026 teşhisi (B-44): "bot filtresi" tahmini YANLIŞTI. DNS
      çözülüyor (212.174.186.1) ve TCP 443 açılıyor, ama sunucu
      ClientHello'dan hemen sonra bağlantıyı düşürüyor
      (SSL: UNEXPECTED_EOF_WHILE_READING). Denenip elenenler: TLS 1.2'ye
      sabitleme, SECLEVEL=1, eski yeniden anlaşma, doğrulama kapatma,
      www'suz alan adı, Windows schannel + konteyner OpenSSL. Hepsi aynı
      noktada düşüyor — HTTP katmanına HİÇ ulaşılmıyor, dolayısıyla
      User-Agent/robots ile ilgisi yok. Ağ/IP düzeyinde engel gibi
      görünüyor; farklı bir çıkış IP'si (TR) gerektirir.
    notes: >-
      Konu filtresi ZORUNLU: filtresiz ingestion articles tablosunu
      alakasız kayıtla doldurur ve embedding maliyetini boşa harcar.

