# PolitikDesk — makro ekonomi kaynak listesi (F0-08, F0-09)
#
# ⛔ SERT KURAL (Spec §9.2 / D6): kaynak sayısı `max_sources` ile sınırlıdır.
#    Bu dosyada yürürlükteki sınır AŞAĞIDAKİ `max_sources` alanıdır;
#    `tests/test_sources_config.py` onu zorlar. Sayıyı bu yorumda ayrıca
#    tekrarlamıyoruz — 15 yazan eski bir metin burada aylarca kaldı ve
#    dosyanın kendi ayarıyla çelişti.
#
#    SINIR NEDEN 8'DEN YUKARI ÇIKTI (F5-01, 13 Ağu 2026 ölçümü):
#    8 sınırı bir kalite korumasıydı — "kaynak eklemek yanıltıcı derecede
#    tatmin edicidir, kümeleme hatasını gizler". Gerekçe hâlâ geçerli, ama
#    ölçüm sınırın ürünün ANA metriğini yapısal olarak engellediğini
#    gösterdi: 28 olayın 21'i tek makaleli, iddiası olan 25 olayın yalnızca
#    2'sinde birden fazla bağımsız kaynak grubu var. Kanıt motoru R2 (🟢)
#    `independent_count >= 3` istiyor; hiçbir olayda 2'yi geçmiyor. Yani
#    🟢 teyit YAPISAL OLARAK imkânsızdı ve `diversity_ratio` 1,0'da
#    çakılıydı (hedef 2,5).
#
#    Sınır gevşedi, KALİTE KAPILARI GEVŞEMEDİ: tavana tek adımda çıkılmaz.
#    Önce 10, en az bir hafta ölçüm (kümeleme precision >= 0,88 korunuyor
#    mu, konu filtresi yeni kaynaklarda alakasız içerik geçiriyor mu),
#    ancak regresyon yoksa devam (F5-05). Yürürlükteki kadro bu yolla
#    kademe kademe çıktı. 19 Ağu 2026: EVDS için 20 -> 21 (gerekçe o
#    kaynağın `notes` alanında; medya değil, kurumun veri servisi).
#    20 Ağu 2026: SBB için 21 -> 22 (gerekçe o kaynağın `notes` alanında;
#    yine medya değil, Tier 1 kurum yayını).
#
#    ⛔ SINIR = KAYNAK SAYISI. Bu dosyada boşluk BIRAKILMAZ ve bu bilinçli
#    bir tasarımdır: `max_sources` her zaman mevcut kaynak sayısına eşittir,
#    dolayısıyla bir kaynak eklemek MUTLAKA sınırı da değiştirmeyi gerektirir
#    ve o değişiklik `tests/test_sources_config.py`'yi kırar. Yani hiçbir
#    kaynak "sınırın altında yer vardı" diye sessizce eklenemez; her ekleme
#    açık bir karardır. Denetim: `test_cap_has_no_silent_headroom`.
#
# ⛔ tos_status='forbidden' kaynaktan ingestion kod seviyesinde engellidir
#    (politikdesk/ingestion/guard.py, F1-06).
#
# Doğrulama durumu (12 Ağu 2026):
#   ✅ akış canlı test edildi, gerçek veri döndü
#   🔎 akış yerel ağdan doğrulanmalı: `python -m scripts.discover_feeds`
#
# REUTERS DÜŞÜRÜLDÜ: açık RSS ucu yok, içerik lisansa tabi. Spec §9.2'nin
# "uluslararası çapraz teyit" rolü sonradan DW ve Euronews Türkçe ile
# dolduruldu; ikisi de ayrı sahiplik grubunda ve canlı doğrulandı.

version: 3
vertical: macro_economy
max_sources: 25


