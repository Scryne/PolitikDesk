# PolitikDesk — çalıştırma ortamı (F0-12, F4-10)
# Spec §11.1 (D12): tek makine + Docker Compose. Kubernetes MVP'de yasak.
#
#   make up        db + redis + migrate + api
#   make workers   worker + beat (YENİDEN KURARAK — bkz. B-77)
#
# `restart: unless-stopped` (F4-10): Docker Desktop açılışta başlatılacak
# şekilde ayarlıysa, makine yeniden başladığında tüm yığın kendiliğinden
# kalkar. "unless-stopped", `always`a tercih edildi: `make down` ile
# bilerek durdurulan bir yığını sonraki açılışta geri getirmez.
#
# `migrate` bilerek HARİÇ tutuldu — bir kez koşup çıkar; yeniden
# başlatılırsa sonsuz döngüye girer.
#
# ⚠ PORTLAR `127.0.0.1`E BAĞLI (F4-09). Docker'ın `"5432:5432"` kısayolu
# portu `0.0.0.0`a, yani makinenin KATILDIĞI HER AĞA açar. 13 Ağustos
# 2026 güvenlik gözden geçirmesinde ölçülen durum buydu: Postgres
# (politikdesk/politikdesk) ve Redis (kimlik doğrulamasız) kafe ya da
# otel Wi-Fi'ında aynı ağdaki herkese açıktı. Konteynerler birbirine
# Docker ağı üzerinden (`db:5432`) bağlanır; loopback'e bağlamak onları
# etkilemez, yalnızca dışarıyı keser.

# I03 düzeltmesi: kimlik bilgileri TEK YERDE tanımlanır. Beş servis
# aynı kullanıcı/parola/veritabanını tekrarlıyordu — birinde değiştirip
# diğerini unutmak sessiz bağlantı hatalarına yol açardı.
x-db-env: &db-env
  PD_DB_USER: ${PD_DB_USER:-politikdesk}
  PD_DB_PASS: ${PD_DB_PASS:-politikdesk}
  PD_DB_NAME: ${PD_DB_NAME:-politikdesk}

# I02 düzeltmesi: Redis kimlik doğrulaması. Parola yokken aynı ağdaki
# herhangi bir süreç Celery kuyruğuna okuma/yazma yapabilirdi.
x-redis-env: &redis-env
  PD_REDIS_PASSWORD: ${PD_REDIS_PASSWORD:-politikdesk}

x-build-args: &build-args
  GIT_SHA: ${PD_GIT_SHA:-}
  BUILD_TIMESTAMP: ${PD_BUILD_TIMESTAMP:-}
  IMAGE_DIGEST: ${PD_IMAGE_DIGEST:-}

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pd-db
    restart: unless-stopped
    # `pg_stat_statements` (F4-08): N+1 sorgu denetimi bir sayfanın kaç
    # SQL çağrısı ürettiğini saymayı gerektirir. Uzantı `shared_preload_
    # libraries` ile yüklenmek zorundadır — sonradan `CREATE EXTENSION`
    # yetmez. Onsuz `scripts.perf_check` denetimi ATLAR ve bunu söyler;
    # sessizce "temiz" demez.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    environment:
      POSTGRES_USER: ${PD_DB_USER:-politikdesk}
      POSTGRES_PASSWORD: ${PD_DB_PASS:-politikdesk}
      POSTGRES_DB: ${PD_DB_NAME:-politikdesk}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PD_DB_USER:-politikdesk} -d ${PD_DB_NAME:-politikdesk}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: pd-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${PD_REDIS_PASSWORD:-politikdesk}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${PD_REDIS_PASSWORD:-politikdesk}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      args:
        <<: *build-args
    container_name: pd-migrate
    command: ["python", "-m", "scripts.migrate", "up"]
    environment:
      <<: [*db-env, *redis-env]
      PD_DATABASE_URL: postgresql://${PD_DB_USER:-politikdesk}:${PD_DB_PASS:-politikdesk}@db:5432/${PD_DB_NAME:-politikdesk}
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/app/migrations:ro

  api:
    build:
      context: .
      args:
        <<: *build-args
    container_name: pd-api
    restart: unless-stopped
    command:
      ["uvicorn", "politikdesk.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: [*db-env, *redis-env]
      PD_DATABASE_URL: postgresql://${PD_DB_USER:-politikdesk}:${PD_DB_PASS:-politikdesk}@db:5432/${PD_DB_NAME:-politikdesk}
      PD_REDIS_URL: redis://:${PD_REDIS_PASSWORD:-politikdesk}@redis:6379/0
      PD_TWITTER_BRIDGE_URL: http://rsshub:1200
      # Metrik panosu gün sınırına bakar (`date.today()`); UTC'de kalırsa
      # akşam üretilen bir taslak ertesi günün kutusuna düşerdi.
      TZ: ${TZ:-Europe/Istanbul}
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Ingestion, embedding ve varlık çıkarımı görevlerini çalıştırır (F1-05).
  # Embedding'i fiilen koşan tek servis budur; `embed-local` ekstrası (torch +
  # sentence-transformers) yalnızca buraya kurulur (B-54).
  worker:
    build:
      context: .
      args:
        <<: *build-args
        PD_EXTRAS: embed-local
    container_name: pd-worker
    restart: unless-stopped
    command:
      ["celery", "-A", "politikdesk.worker.app", "worker", "-l", "info",
       "--concurrency", "2"]
    environment:
      <<: [*db-env, *redis-env]
      PD_DATABASE_URL: postgresql://${PD_DB_USER:-politikdesk}:${PD_DB_PASS:-politikdesk}@db:5432/${PD_DB_NAME:-politikdesk}
      PD_REDIS_URL: redis://:${PD_REDIS_PASSWORD:-politikdesk}@redis:6379/0
      # D16 kararı imajın içinde sabit: .env eksik olsa bile worker sessizce
      # `hashing` embedder'a düşmesin (Faz 2 canlı koşumunda olan buydu).
      TZ: ${TZ:-Europe/Istanbul}
      PD_EMBEDDING_PROVIDER: ${PD_EMBEDDING_PROVIDER:-local}
      PD_EMBEDDING_MODEL: ${PD_EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      PD_TWITTER_BRIDGE_URL: http://rsshub:1200
      PD_TWITTER_INGESTION_ENABLED: ${PD_TWITTER_INGESTION_ENABLED:-true}
    env_file:
      - path: .env
        required: false
    volumes:
      # Model (~2,2 GB) konteyner yeniden kurulunca tekrar inmesin.
      - hfcache:/opt/hf-cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["workers"]

  # Zamanlayıcı: 5 dakikalık toplama döngüsü, embed, purge (F1-05, F1-12)
  # + Faz 3: sabah/akşam brifingi ve gecelik metrik toplaması (F3-16, F3-19).
  beat:
    build:
      context: .
      args:
        <<: *build-args
    container_name: pd-beat
    restart: unless-stopped
    command:
      ["celery", "-A", "politikdesk.worker.app", "beat", "-l", "info"]
    environment:
      <<: [*db-env, *redis-env]
      PD_DATABASE_URL: postgresql://${PD_DB_USER:-politikdesk}:${PD_DB_PASS:-politikdesk}@db:5432/${PD_DB_NAME:-politikdesk}
      PD_REDIS_URL: redis://:${PD_REDIS_PASSWORD:-politikdesk}@redis:6379/0
      # Brifing saatleri `crontab` ile kurulur ve konteynerin saat
      # dilimine bakar. TZ verilmezse UTC kullanılır ve "08:00 sabah
      # brifingi" Türkiye'de 11:00'e düşerdi.
      TZ: ${TZ:-Europe/Istanbul}
      PD_TWITTER_BRIDGE_URL: http://rsshub:1200
      PD_TWITTER_INGESTION_ENABLED: ${PD_TWITTER_INGESTION_ENABLED:-false}
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["workers"]

  rsshub:
    image: diygod/rsshub:latest
    container_name: pd-rsshub
    restart: unless-stopped
    ports:
      - "127.0.0.1:1200:1200"
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://:${PD_REDIS_PASSWORD:-politikdesk}@redis:6379/1
      TWITTER_COOKIES: ${PD_TWITTER_COOKIES:-}
      TWITTER_AUTH_TOKEN: ${PD_TWITTER_AUTH_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["social", "full", "workers"]

volumes:
  pgdata:
  redisdata:
  hfcache:
