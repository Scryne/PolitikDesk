[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "politikdesk"
version = "0.1.0"
description = "PolitikDesk — AI Political Intelligence & Editorial Workspace (MVP: makro ekonomi)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Spec §11.1 — teknoloji yığını kararı (D11)
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # `.env`'i sürecin ortamına yüklemek için doğrudan kullanılır
    # (`config.load_env_file`); pydantic-settings'in dolaylı bağımlılığına
    # güvenmek yerine açıkça bildirilir.
    "python-dotenv>=1.0",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.2",
    "celery>=5.4",
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.18",
    "anthropic>=0.40",
    "httpx>=0.27",
    "tenacity>=9.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    # B-83: bağımlılık güvenlik taraması. F4-09 güvenlik gözden
    # geçirmesinde koşulmamıştı; artık CI adımı (`make audit`).
    "pip-audit>=2.7",
]
# F0-13 embedding benchmark'ı için (opsiyonel, ağır bağımlılıklar)
bench = [
    "numpy>=2.1",
    "scikit-learn>=1.5",
]
# D16: self-host embedding (multilingual-e5-large). Worker konteynerinde
# gereklidir; API konteynerinde gerekmez. ~2,5 GB (torch CPU + model).
embed-local = [
    "torch>=2.5",
    "sentence-transformers>=3.3",
]

[tool.hatch.build.targets.wheel]
packages = ["politikdesk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]  # FastAPI Depends() varsayılan argümanda kullanılır

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: Postgres bağlantısı gerektiren testler (DATABASE_URL ayarlı olmalı)",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
packages = ["politikdesk"]
ignore_missing_imports = true
warn_unused_ignores = true
